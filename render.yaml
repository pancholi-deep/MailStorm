# Supply the shared secrets in the Render environment group before deployment.
# S3 bucket and its CORS policy must be provisioned separately.
envVarGroups:
  - name: mailstorm-shared
    envVars:
      - key: APP_ENV
        value: production
      - key: EMBEDDED_WORKER
        value: 'false'
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
services:
  - type: web
    name: mass-email-backend
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    preDeployCommand: python -m backend.jobs.migrate
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /readyz
    envVars:
      - fromGroup: mailstorm-shared
      - key: DATABASE_URL
        fromDatabase:
          name: mailstorm-db
          property: connectionString
  - type: worker
    name: mailstorm-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.jobs.worker
    envVars:
      - fromGroup: mailstorm-shared
      - key: DATABASE_URL
        fromDatabase:
          name: mailstorm-db
          property: connectionString
databases:
  - name: mailstorm-db
    plan: basic-256mb
